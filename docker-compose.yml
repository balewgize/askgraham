name: askgraham

# LOCAL DEVELOPMENT. One command, and you never need `--build` again:
#
#   docker compose up
#
# Source is bind-mounted and both services hot-reload on save. The frontend
# runs `next dev` against the full node_modules; the API runs uvicorn --reload.
#
# Production:
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Shares this project name with prod on purpose. The port bindings collide, so
# the two stacks cannot run side by side against different databases.

#   web -> http://localhost:3000      (only origin the browser talks to)
#   api -> http://localhost:8000/docs (exposed for API docs/evals convenience)
#   db  -> localhost:5433             (local psql access)
#
# The frontend proxies /api/* to the backend, so the browser never needs CORS.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askgraham
      POSTGRES_PASSWORD: askgraham
      POSTGRES_DB: askgraham
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API runs migrations on boot, so it must not start until Postgres
      # is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U askgraham -d askgraham"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://askgraham:askgraham@db:5432/askgraham
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Live source. api_venv re-hides the host's .venv, which would otherwise
      # shadow the image's and break every import.
      - ./backend:/app
      - api_venv:/app/.venv
      # Local ONNX embedding/reranker weights. Kept across restarts so the
      # ~150MB download happens once.
      - api_models:/models
      # Read-only corpus, so Phase 5+ can re-index without a rebuild.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    # Migrations apply at container start only, not on reload. After adding
    # one, run `docker compose restart api`.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn main:app --reload --host 0.0.0.0 --port 8000
             --reload-exclude .venv --reload-exclude __pycache__"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      # Server-side rewrite target. Unreachable from the browser by design.
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    # Same three-masks-the-bind-mount trick as api: node_modules and .next come
    # from the volumes, not the host checkout. Keeping .next on a volume also
    # preserves the Turbopack dev cache across container restarts.
    volumes:
      - ./frontend:/repo/frontend
      - web_node_modules:/repo/frontend/node_modules
      - web_next:/repo/frontend/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_venv:
  api_models:
  web_node_modules:
  web_next:
