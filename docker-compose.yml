name: askgraham

# One command brings up everything: `docker compose up --build`
#
#   web -> http://localhost:3000      (only origin the browser talks to)
#   api -> http://localhost:8000/docs (exposed for API docs/evals convenience)
#   db  -> localhost:5433             (local psql access)
#
# The frontend proxies /api/* to the backend, so the browser never needs CORS.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askgraham
      POSTGRES_PASSWORD: askgraham
      POSTGRES_DB: askgraham
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API runs migrations on boot, so it must not start until Postgres
      # is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U askgraham -d askgraham"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://askgraham:askgraham@db:5432/askgraham
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Read-only corpus. The API serves derived data from Postgres; this exists
      # so Phase 5+ can re-index without rebuilding the image.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    # Idempotent: re-running applies any pending migrations, then starts the app.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Server-side rewrite target. Unreachable from the browser by design.
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: